name: Build iOS IPA
on:
  push:
    branches: [ main ]

jobs:
  build-project:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Mobile Tools
        run: |
          npm install @capacitor/cli@6 @capacitor/core@6
          npx cap init KYUPRMIX com.kyuperdomo.kyuprmix --web-dir=.
          npx cap add ios

      - name: Sync Web Code to App Container
        run: npx cap sync ios

      - name: Compile and Build App Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO

      - name: Compress into IPA Format
        run: |
          mkdir -p Payload
          mv ios/App/build/Debug-iphoneos/App.app Payload/
          zip -r KyuprMix.ipa Payload

      - name: Save IPA File to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: KyuprMix-App-Build
          path: KyuprMix.ipa